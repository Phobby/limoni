# XcodeGen spec: `xcodegen generate` writes LemonDrop.xcodeproj.
# The Go game is linked as build/Mobile.xcframework (see ../docs/BUILD.md).
name: LemonDrop
options:
  bundleIdPrefix: com.limoni
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""          # set your team to sign for a device
    CODE_SIGN_STYLE: Automatic
targets:
  LemonDrop:
    type: application
    platform: iOS
    sources:
      - path: LemonDrop
    dependencies:
      - framework: build/Mobile.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.limoni.lemondrop
        INFOPLIST_FILE: LemonDrop/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: ["-lresolv"]
        ENABLE_BITCODE: NO
